plugins {
    id 'com.android.application'
}

// No GitHub, cada build ganha um número maior, para o Android aceitar a atualização por cima.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int
// Repositório de onde o app busca a versão mais nova da página (preenchido pelo GitHub Actions).
def repo = System.getenv('GITHUB_REPOSITORY') ?: 'Slashovisk/Quadro-'

android {
    namespace 'br.com.arquivoinvestigacoes'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.arquivoinvestigacoes'
        minSdk 26
        targetSdk 35
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
        buildConfigField 'String', 'UPDATE_URL', "\"https://raw.githubusercontent.com/${repo}/main/web/index.html\""
    }

    buildFeatures {
        buildConfig true
    }

    // A página do app fica em web/index.html e vai junto no APK (funciona offline na primeira vez).
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../web']
        }
    }

    signingConfigs {
        // Chave fixa: assim uma versão nova instala por cima da antiga sem apagar os quadros.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
